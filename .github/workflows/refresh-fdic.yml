name: Refresh failed-bank data

# The FDIC's failure list changes only when a bank fails, so monthly is plenty.
# A run with no changes commits nothing. No API key is needed.
on:
  schedule:
    - cron: "23 10 7 * *"   # 7th of each month, 10:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the list from FDIC data
        run: node scripts/build-fdic.mjs
      - name: Tests still pass
        run: npm test
      - name: Commit if the data changed
        run: |
          git add data/fdic
          if git diff --cached --quiet -- data/fdic; then
            echo "No change in FDIC data." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh failed-bank data from FDIC BankFind"
          git pull --rebase
          git push
          echo "Published $(jq '.rows|length' data/fdic/failures.json) failed or assisted banks." >> "$GITHUB_STEP_SUMMARY"
