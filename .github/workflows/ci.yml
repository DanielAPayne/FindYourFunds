name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Tracker CSV matches the registry
        run: npm run check:csv
      - name: Scripts parse in the browser
        run: for f in src/*.js; do node --check "$f"; done
